name: SEO/AIO/MEO Production Health

on:
  # GitHub Actions uses UTC. 22:23 UTC is 07:23 JST on the following day.
  schedule:
    - cron: '23 22 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/verify-*.mjs'
      - .github/workflows/seo-health-monitor.yml

permissions:
  contents: read

concurrency:
  group: seo-health-production-monitor
  cancel-in-progress: false

jobs:
  seo-health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Run local SEO/AIO guardrails
        run: |
          node scripts/audit-seo-links.mjs
          node scripts/audit-canonical-host-redirect.mjs
          node scripts/audit-local-business-consistency.mjs
          node scripts/audit-title-length.mjs
          node scripts/audit-seo-indexability.mjs
          node scripts/audit-noindex-intent.mjs
          node scripts/audit-case-evidence.mjs
          node scripts/audit-case-public-sources.mjs
          node scripts/audit-markdown-artifacts.mjs
          node scripts/audit-structured-data.mjs
          node scripts/audit-llms.mjs
          node scripts/audit-priority-internal-links.mjs
          node scripts/audit-gsc-priority-intent.mjs
          node scripts/audit-hero-preload.mjs
          node scripts/audit-private-seo-data.mjs
          node scripts/audit-public-file-exposure.mjs
          node --check scripts/verify-public-file-exposure.mjs
          node --check scripts/verify-case-public-sources.mjs
          node --check scripts/verify-production-local-business-consistency.mjs
          node --check scripts/verify-production-seo-health.mjs

      # Pull requests validate code and local invariants only. Production availability
      # is monitored by scheduled/manual runs so transient Xserver network filtering
      # does not make an otherwise safe PR impossible to review.
      - name: Verify production SEO/AIO/MEO suite with retry
        if: github.event_name != 'pull_request'
        run: |
          for attempt in 1 2 3; do
            if node scripts/verify-public-file-exposure.mjs \
              && node scripts/verify-case-public-sources.mjs \
              && node scripts/verify-production-local-business-consistency.mjs \
              && node scripts/verify-production-seo-health.mjs; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Production verification attempt $attempt failed; retrying after $((attempt * 30)) seconds."
              sleep $((attempt * 30))
            fi
          done
          exit 1

  notify-failure:
    needs: seo-health
    if: ${{ always() && needs.seo-health.result == 'failure' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const label = 'seo-health';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: 'B60205',
                description: 'SEO/AIO/MEO production health monitor failure',
              });
            }

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 100,
            });
            const body = [
              '本番のSEO/AIO/MEO読み取り専用監視が失敗しました。',
              '',
              `- 失敗した実行: ${runUrl}`,
              `- コミット: \`${context.sha.slice(0, 7)}\``,
              '',
              '重点ページ、サイトマップ、AI向け案内ファイル、事例の出典・noindex隔離のいずれかを確認してください。',
              '監視自体は本番サイトや外部サービスを変更しません。',
            ].join('\n');

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `再び失敗しました（${new Date().toISOString().slice(0, 16)}）: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🚨 SEO/AIO/MEO本番監視が失敗しています',
                body,
                labels: [label],
              });
            }

  close-failure-issue:
    needs: seo-health
    if: ${{ always() && needs.seo-health.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'seo-health',
              });
            } catch (error) {
              if (error.status === 404) {
                core.info('No seo-health label exists yet; there is no failure issue to close.');
                return;
              }
              throw error;
            }
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'seo-health',
              per_page: 100,
            });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `本番監視が成功したため閉じます（${new Date().toISOString().slice(0, 16)}）。`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
