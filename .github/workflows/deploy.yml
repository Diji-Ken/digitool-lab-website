name: Deploy to Xserver

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 同時デプロイによるFTP接続競合(Timeout)を防ぐため、デプロイは1つずつ順次実行する
concurrency:
  group: xserver-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v5
      with:
        # IndexNowへ今回変更したURLだけを通知できるよう、直前のmainも取得する
        fetch-depth: 2

    - name: Run SEO link audit
      run: node scripts/audit-seo-links.mjs

    - name: Run canonical host redirect audit
      run: node scripts/audit-canonical-host-redirect.mjs

    - name: Run title length audit
      run: node scripts/audit-title-length.mjs

    - name: Run SEO indexability audit
      run: node scripts/audit-seo-indexability.mjs

    - name: Run noindex intent audit
      run: node scripts/audit-noindex-intent.mjs

    - name: Run markdown artifact audit
      run: node scripts/audit-markdown-artifacts.mjs

    - name: Run structured data audit
      run: node scripts/audit-structured-data.mjs

    - name: Run LLMS audit
      run: node scripts/audit-llms.mjs

    - name: Run priority internal link audit
      run: node scripts/audit-priority-internal-links.mjs

    - name: Run hero preload audit
      run: node scripts/audit-hero-preload.mjs

    - name: Run private SEO data audit
      run: node scripts/audit-private-seo-data.mjs
    
    - name: Deploy to Xserver via FTP
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: SamKirkland/FTP-Deploy-Action@v4.4.0
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        # 2026-08-01: 平文FTPだと GitHub Actions から接続できずタイムアウトするようになった
        #   （手元の国内回線からは 220 応答あり。サーバーは AUTH TLS successful を返すためFTPS対応）
        #   接続に30秒かかる場合もあるため timeout も延長する
        protocol: ftps
        timeout: 120000
        server-dir: /digitool-lab.com/public_html/
        local-dir: ./
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/.DS_Store
          **/README.md
          **/tools/**
          **/upload-all.sh
          **/data/gsc/**
          data/gsc/**

    - name: Notify IndexNow about changed pages
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      continue-on-error: true
      timeout-minutes: 2
      run: >-
        node scripts/submit-indexnow.mjs
        --before "${{ github.event.before }}"
        --after "${{ github.sha }}"

  # デプロイが失敗したらIssueを立てて気づけるようにする。
  # 2026-07-23〜08-01の9日間、CIが落ち続けていたのに誰も気づかず記事が本番404のままだった。
  # Chatwork通知にはトークンをSecretへ置く必要があり、漏洩の置き場所を増やしたくないため、
  # GITHUB_TOKEN だけで完結するIssue作成にしている（Issueが立てばGitHubの標準通知でメールが届く）。
  notify-failure:
    needs: deploy
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = '🚨 本番デプロイが失敗しています';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'deploy-failure',
            });
            const body = [
              '本番デプロイが失敗しました。**記事が公開されていません。**',
              '',
              `- 失敗した実行: ${runUrl}`,
              `- ブランチ: \`${context.ref}\``,
              `- コミット: ${context.sha.slice(0, 7)}`,
              '',
              '## 確認の手順',
              '1. 上のリンクでログを開き、どのステップで落ちたか見る',
              '2. 監査系（audit-*）で落ちた場合はリンク切れやnoindexを疑う',
              '3. FTPで落ちた場合は `docs/ftp-deploy-recovery-20260802.md` を読む',
              '',
              '直ってデプロイが成功したら、このIssueは自動で閉じます。',
            ].join('\n');
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `また失敗しました（${new Date().toISOString().slice(0, 16)}）: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['deploy-failure'],
              });
            }

  # 復旧したら、開いている失敗Issueを閉じる
  close-failure-issue:
    needs: deploy
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'deploy-failure',
            });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `デプロイが成功したので閉じます（${new Date().toISOString().slice(0, 16)}）。`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
